[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-worlds"
version = "0.5.0"
description = "Grid-Bench: evaluating spatial state prediction under prescribed operations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pyright>=1.1.390",
  "pytest>=8.0",
  "ruff>=0.9",
]
eval = [
  "anthropic>=1.0",
  "boto3>=1.40",
  "openai>=1.50",
]
plots = [
  "matplotlib>=3.8",
]

[project.scripts]
spatial-worlds = "spatial_worlds.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "frozen_data: requires the archived formal binding and generated study datasets",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["spatial_worlds"]
known-local-folder = ["oracles"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
