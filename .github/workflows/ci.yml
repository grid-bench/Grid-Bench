name: Offline checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test and build dependencies
        run: python -m pip install -e '.[dev,plots]' build
      - name: Portable tests
        run: python -m pytest
      - name: Check source style and typing
        run: |
          ruff check src tests scripts examples
          pyright --pythonpath "$(python -c 'import sys; print(sys.executable)')" src tests
      - name: Small credential-free examples
        run: |
          grid-bench demo
          python scripts/quickstart.py
      - name: Build source and wheel distributions
        run: python -m build
      - name: Verify installation away from the checkout
        run: |
          python -m venv "$RUNNER_TEMP/grid-bench-installed"
          "$RUNNER_TEMP/grid-bench-installed/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/grid-bench-installed/bin/grid-bench" families --json
          "$RUNNER_TEMP/grid-bench-installed/bin/grid-bench" demo
          "$RUNNER_TEMP/grid-bench-installed/bin/python" -c 'from grid_bench import load_benchmark, evaluate_predictions, render_prompt; import importlib.util; assert importlib.util.find_spec("spatial_worlds") is None'
